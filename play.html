<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The game: one full-window view. Flight HUD is drawn on a 2D canvas over the GL canvas; the strip at the
   bottom holds the session controls. */
:root {
  color-scheme: dark;
  --bg: #07090c; --rail: #0c1015; --line: #1e2630; --fg: #dbe0e7; --muted: #8a95a4; --amber: #e2b866; --amber-ink: #1b1508; --bad: #f08a72;
  --f-display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#view, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#view { outline: none; }
#hud { pointer-events: none; }
.strip {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; background: rgba(12, 16, 21, .9); border-top: 1px solid var(--line);
}
.strip h1 { margin: 0 8px 0 0; font: 700 17px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.strip .keys { color: var(--muted); font: 12px var(--f-mono); }
.strip .spacer { flex: 1; }
.strip button, .strip a {
  background: #121821; border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer;
  font: 600 12.5px var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); text-decoration: none;
}
.strip button:hover, .strip a:hover { border-color: var(--amber); }
.strip button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
#toast {
  position: fixed; left: 50%; top: 18px; transform: translateX(-50%); padding: 6px 14px; border-radius: 6px;
  background: rgba(12, 16, 21, .9); border: 1px solid var(--line); font: 500 13px var(--f-mono); color: var(--amber);
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
#toast.on { opacity: 1; }
#glerr { position: fixed; inset: 0; display: grid; place-items: center; color: var(--bad); font: 15px var(--f-mono); }
/* the port screen: the world you landed on fills the view, dimmed; the port's card sits over its left side */
#port { position: fixed; inset: 0 0 auto 0; bottom: 0; display: grid; align-items: center; padding: 24px 24px 72px;
  background: linear-gradient(90deg, rgba(7,9,12,.88) 0%, rgba(7,9,12,.62) 42%, rgba(7,9,12,.08) 75%); }
.port-card { max-width: 460px; }
.port-kicker { margin: 0 0 6px; color: var(--amber); font: 600 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.port-card h2 { margin: 0 0 12px; font: 700 40px/1 var(--f-display); letter-spacing: .03em; }
.port-desc { margin: 0 0 22px; color: #c4ccd6; font-size: 15px; line-height: 1.55; }
.port-services { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.port-services button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-align: left;
  background: rgba(18,24,33,.86); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer;
  font: 600 13.5px var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.port-services button span { color: var(--muted); font: 400 11px var(--f-mono); text-transform: none; letter-spacing: 0; }
.port-services button:hover:not(:disabled) { border-color: var(--amber); }
.port-services button:disabled { cursor: default; color: var(--muted); }
.port-services button.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.port-day { margin: 18px 0 0; color: var(--muted); font: 500 12px var(--f-mono); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Flight view"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<div id="glerr" hidden>This needs WebGL2.</div>
<section id="port" hidden aria-label="Port">
  <div class="port-card">
    <p class="port-kicker" id="port-kicker"></p>
    <h2 id="port-name"></h2>
    <p class="port-desc" id="port-desc"></p>
    <div class="port-services">
      <button type="button" disabled>Trade<span>next</span></button>
      <button type="button" disabled>Mission board<span>next</span></button>
      <button type="button" disabled>Bar<span>later</span></button>
      <button type="button" disabled>Refuel &amp; repair<span>later</span></button>
      <button type="button" id="svc-wait">Wait a day<span>W</span></button>
      <button type="button" id="svc-launch" class="primary">Launch<span>L</span></button>
    </div>
    <p class="port-day" id="port-day"></p>
  </div>
</section>
<div class="strip">
  <h1>Driftward</h1>
  <span class="keys">W S speed · A D turn · Q E strafe · X retro · Shift burn · F assist level · L land · I nav · wheel zoom</span>
  <span class="spacer"></span>
  <button type="button" id="b-nav" title="I" aria-pressed="false">Nav</button>
  <button type="button" id="b-save" title="F6">Save</button>
  <button type="button" id="b-load" title="F9">Load</button>
  <button type="button" id="b-new">New game</button>
  <button type="button" id="b-replay" title="Download the snapshot and input log since the last new game or load">Export replay</button>
  <a href="index.html">Lab</a>
</div>

<script id="system" type="application/json">{"id": "brannock", "name": "Brannock", "owner": "ironhulls", "ring": "middle", "description": "An Ironhull system of the middle ring: an orange star, a scorched mining world, a cloudy habitat world where most of its people live, a gas giant whose moon refines what the mines dig up, and a shipyard station where the Ironhulls weld their hulls.", "star": {"name": "Brannock", "class": "orange", "radius": 2400, "gravity": 55}, "start": "halde", "bodies": [{"id": "cinder", "name": "Cinder", "kind": "planet", "orbit": {"radius": 11000, "angle": 35}, "radius": 900, "gravity": 25, "look": {"surface": "rock", "palette": ["#4a3a33", "#7a5a46", "#c08a5a"], "atmosphere": "#d08a58", "seed": 3.3}, "port": {"name": "Cinder Deep", "role": "mining", "population": "outpost", "services": ["market", "missions", "bar", "refuel", "repair"], "description": "Shafts sunk into a world too close to its star. The day side cooks; the crews live and work on the night side, in tunnels that follow the ore. Ore goes up the lift to waiting tugs; food, water and spare parts come down."}}, {"id": "halde", "name": "Halde", "kind": "planet", "orbit": {"radius": 19000, "angle": 200}, "radius": 1500, "gravity": 40, "look": {"surface": "terran", "palette": ["#1d4f7a", "#5d7a3c", "#d8cba8"], "atmosphere": "#6fb3ff", "seed": 1.3, "cityLights": 1}, "port": {"name": "Halde Landing", "role": "habitat", "population": "town", "services": ["market", "missions", "bar", "refuel", "repair"], "description": "The system's only real town: terraces of habitat blocks along a cold coast, a landing field cut into the cliffs above them. Most of Brannock's people live here, and most of its money changes hands in the market halls by the field."}}, {"id": "vast", "name": "Vast", "kind": "planet", "orbit": {"radius": 32000, "angle": 110}, "radius": 3000, "gravity": 45, "look": {"surface": "giant", "palette": ["#c9925c", "#7d4e33", "#ecd9b0"], "atmosphere": "#ffc98a", "seed": 4.1}}, {"id function generateStation(catalog, archId, brandId, seed) {
  const arch = [...catalog.stations, ...(catalog.heavies || [])].find(a => a.id === archId), brand = catalog.brands.find(b => b.id === brandId);
  const ship = assembleStation(arch, brand, seed);
  const maps = bake(ship, brand, { res: arch.res || 768, length: ship.L });
  return { ship, maps };
}

function generate(catalog, brandId, sizeId, seed) {
  const brand = catalog.brands.find(b => b.id === brandId);
  const sizeIdx = catalog.sizes.findIndex(s => s.id === sizeId);
  const size = catalog.sizes[sizeIdx];
  const ship = assemble(brand, size, seed, sizeIdx);
  const maps = bake(ship, brand, size);
  return { ship, maps };
}

// compact human-readable spec of a ship (for the JSON panel)
function describe(ship) {
  const r2 = v => Math.round(v * 100) / 100;
  return {
    brand: ship.brand, size: ship.size, seed: ship.seed, length_m: ship.L, core: ship.coreTemplate,
    parts: ship.parts.map(p => {
      const a = {}; for (const k in p.a) if (k !== 'pts') a[k] = r2(p.a[k]);
      if (p.a.pts) a.vertices = p.a.pts.length / 2;
      return { tmpl: p.tmpl, role: p.role, prim: p.prim, x: r2(p.x), y: r2(p.y), ang: r2(p.ang), mirrored: p.flip, z: r2(p.z), H: r2(p.H), params: a };
    })
  };
}

// Planets, drawn analytically on a quad 1.3 radii wide. Detail follows the zoom: noise layers are added until the
// finest is about two pixels across (uPx is one pixel in planet radii), up to 12, the last fading in, so there is
// no popping and no shimmer. Noise is 3D value noise on an integer hash, sampled on the sphere itself: seamless,
// and stable at fine scales. Each layer is zero-mean, so coastlines stay put as layers arrive. Layers also return
// their gradient, which bends the surface normal: relief lighting with no extra samples.
// Kinds: 0 terran (ocean, land, mountains, ice, clouds and their shadows, sun glint, city lights at night when
// uCity > 0), 1 banded giant, 2 cratered rock. uC1..3 are the palette; uAtm the atmosphere tint.
const PLANET_FS = `#version 300 es
precision highp float; in vec2 vQ; out vec4 o;
uniform vec3 uSun, uSunCol, uAmb, uC1, uC2, uC3, uAtm; uniform float uSeed, uTime, uPx, uCity; uniform int uKind;
uvec3 pcg3(uvec3 v){ v = v*1664525u + 1013904223u; v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y; v ^= v >> 16u;
  v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y; return v; }
float h3(ivec3 i){ return float(pcg3(uvec3(i)).x) * (1./4294967295.); }
// value noise in [0,1] and its gradient
vec4 vnd(vec3 x){
  vec3 i = floor(x), f = x - i, u = f*f*(3.-2.*f), du = 6.*f*(1.-f);
  ivec3 p = ivec3(i);
  float a = h3(p), b = h3(p+ivec3(1,0,0)), c = h3(p+ivec3(0,1,0)), d = h3(p+ivec3(1,1,0));
  float e = h3(p+ivec3(0,0,1)), g = h3(p+ivec3(1,0,1)), h = h3(p+ivec3(0,1,1)), k = h3(p+ivec3(1,1,1));
  float k1 = b-a, k2 = c-a, k3 = e-a, k4 = a-b-c+d, k5 = a-c-e+h, k6 = a-b-e+g, k7 = -a+b+c-d+e-g-h+k;
  float v = a + k1*u.x + k2*u.y + k3*u.z + k4*u.x*u.y + k5*u.y*u.z + k6*u.z*u.x + k7*u.x*u.y*u.z;
  return vec4(v, du*vec3(k1 + k4*u.y + k6*u.z + k7*u.y*u.z, k2 + k5*u.z + k4*u.x + k7*u.z*u.x, k3 + k6*u.x + k5*u.y + k7*u.x*u.y));
}
// noise layers for features down to about two pixels, for a base frequency f0 (per radius)
float lod(float f0){ return clamp(log2(1./(2.*uPx*f0)), 1., 12.); }
// zero-mean fractal sum with gradient; oct may be fractional (the last layer fades in)
vec4 fbmd(vec3 p, float f0, float gain, float oct){
  vec4 s = vec4(0.); float a = .5, f = f0;
  for (int k = 0; k < 12; k++) {
    float w = clamp(oct - float(k), 0., 1.); if (w <= 0.) break;
    vec4 n = vnd(p*f + float(k)*17.31);
    s += a*w*vec4(n.x - .5, n.yzw*f);
    a *= gain; f *= 2.03;
  }
  return s;
}
// ridged layers (sharp crests), for mountains
vec4 ridged(vec3 p, float f0, float oct){
  vec4 s = vec4(0.); float a = .5, f = f0;
  for (int k = 0; k < 8; k++) {
    float w = clamp(oct - float(k), 0., 1.); if (w <= 0.) break;
    vec4 n = vnd(p*f + float(k)*9.73);
    float q = 2.*n.x - 1., r = 1. - abs(q);
    s += a*w*vec4(r*r, 2.*r*(-sign(q))*2.*n.yzw*f);
    a *= .5; f *= 2.03;
  }
  return s;
}
// craters: one per cell at most, radius under half a cell, so the 8 cells around the point are enough.
// Returns height change and its gradient.
vec4 craters(vec3 p, float F, float depth){
  vec3 q = p*F; vec3 base = floor(q - .5); vec4 s = vec4(0.);
  for (int z = 0; z < 2; z++) for (int y = 0; y < 2; y++) for (int x = 0; x < 2; x++) {
    ivec3 c = ivec3(base) + ivec3(x, y, z);
    uvec3 hv = pcg3(uvec3(c) + 7u); vec3 j = vec3(hv & 1023u)/1023.;
    if (j.x > .55) continue; // not every cell has one
    vec3 ctr = vec3(c) + .5 + (j - .5)*.3; float rad = .18 + .22*j.y;
    vec3 dv = q - ctr; float d = length(dv) + 1e-5;
    if (d > rad*1.6) continue;
    float t = d/rad, bowl = t < 1. ? -(1. - t*t) : 0., rim = .35*exp(-(t - 1.)*(t - 1.)*18.);
    float dbowl = t < 1. ? 2.*t : 0., drim = .35*exp(-(t - 1.)*(t - 1.)*18.)*(-36.)*(t - 1.);
    s += depth*vec4(bowl + rim, (dbowl + drim)/rad*(dv/d)*F);
  }
  return s;
}
// tilt the sphere normal R by a height gradient g (both in planet space): relief
vec3 bump(vec3 R, vec3 g, float k){ return normalize(R - k*(g - dot(g, R)*R)); }
void main(){
  float r = length(vQ);
  vec3 L = normalize(uSun);
  vec2 ld = normalize(L.xy+1e-5);
  if (r > 1.) { // atmosphere halo
    float a = exp(-(r-1.)*9.)*(1.-smoothstep(1.25,1.3,r));
    float lit = clamp(dot(normalize(vQ), ld)*.6+.45, 0., 1.);
    o = vec4(uAtm*uSunCol*a*lit*.8, 0.); return;
  }
  float z = sqrt(1.-r*r); vec3 N = vec3(vQ, z);
  // planet space: the view-space sphere point, spun about the polar axis
  float ca = cos(uTime*.004+uSeed), sa = sin(uTime*.004+uSeed);
  vec3 R = vec3(N.x*ca+N.z*sa, N.y, -N.x*sa+N.z*ca);
  vec3 Lp = vec3(L.x*ca+L.z*sa, L.y, -L.x*sa+L.z*ca); // the sun, in planet space
  vec3 S = vec3(uSeed*3.7, uSeed*1.3, -uSeed*2.1);    // per-planet noise offset
  vec3 alb, Np = R, em = vec3(0.); float spec = 0., wrap = 0.;
  if (uKind == 1) {
    // banded giant: latitude bands, bent by turbulence that gains detail with zoom
    vec4 w = fbmd(R + S, 2., .55, lod(2.));
    float lat = R.y + w.x*.09;
    float b = sin(lat*14. + w.x*2.6);
    alb = mix(uC1, uC2, smoothstep(-.6, .6, b));
    vec4 st = fbmd(vec3(R.x*1.5, R.y*9., R.z*1.5) + S*1.7, 2., .5, lod(9.));
    alb = mix(alb, uC3, smoothstep(.05, .3, st.x)*.85);
    wrap = .25;
  } else if (uKind == 2) {
    // cratered rock: rolling ground plus two crater sizes, a third when close
    vec4 hgt = fbmd(R + S, 3., .5, lod(3.));
    vec4 cr = craters(R + S, 7., .045) + craters(R + S*1.3, 19., .02) + craters(R + S*.7, 55., .009)*clamp(lod(55.) - 1., 0., 1.);
    float h = hgt.x + cr.x*4.;
    alb = mix(uC1, uC2, smoothstep(-.2, .25, h));
    alb = mix(alb, uC3, smoothstep(.18, .4, hgt.x + .5*cr.x));
    alb *= (.85 + .3*vnd((R + S)*40.).x)*clamp(1. + cr.x*5., .6, 1.25); // darker floors, brighter rims
    Np = bump(R, hgt.yzw*.6 + cr.yzw, .035);
  } else {
    // terran: warped continents with ridged mountains, beaches, snow, ice, clouds
    vec3 Rw = R + vnd(R*1.8 + S).yzw*.07;            // warp: coastlines that wander
    vec4 hgt = fbmd(Rw + S, 2.2, .47, lod(2.2));
    float land = smoothstep(0., .02, hgt.x);
    vec4 mt = ridged(Rw + S*1.9, 6., lod(6.) - 1.);
    float mtn = smoothstep(.03, .2, hgt.x);            // mountains rise inland, not at the coast
    float h = hgt.x + mt.x*.22*mtn;
    vec3 grad = hgt.yzw + mt.yzw*.22*mtn;
    float polar = smoothstep(.78, .9, abs(R.y) + hgt.x*.4);
    vec3 deep = uC1*.45, shallow = mix(uC1, vec3(.25, .6, .65), .35);
    vec3 ocean = mix(deep, shallow, smoothstep(-.12, 0., hgt.x));
    vec3 ground = mix(uC2, uC3, smoothstep(.06, .22, h));
    ground = mix(ground, mix(uC3, vec3(.95, .9, .78), .5), smoothstep(.006, 0., hgt.x)*land); // beaches
    ground = mix(ground, vec3(.92, .94, .97), smoothstep(.2, .28, h));                         // snow on peaks
    alb = mix(ocean, ground, land);
    alb = mix(alb, vec3(.9, .93, .97), polar);
    Np = land > .5 ? bump(R, grad, .028) : R;
    spec = (1. - land)*(1. - polar);
    // clouds, drifting faster than the ground, and the shadow they cast (sampled toward the sun)
    vec3 Rc = vec3(R.x*cos(uTime*.002) - R.z*sin(uTime*.002), R.y, R.x*sin(uTime*.002) + R.z*cos(uTime*.002));
    float cOct = min(lod(3.), 10.);
    float cl = smoothstep(.02, .2, fbmd(Rc*vec3(1., 1.6, 1.) + S*2.3, 3., .55, cOct).x);
    float clS = smoothstep(.02, .2, fbmd((Rc + Lp*.012)*vec3(1., 1.6, 1.) + S*2.3, 3., .55, min(cOct, 5.)).x);
    alb *= 1. - .5*clS;
    // city lights, on the night side of inhabited land near the coast
    if (uCity > 0.) {
      float coast = smoothstep(.12, .0, hgt.x)*land;
      float town = smoothstep(.6, .85, vnd((R + S)*38.).x) * smoothstep(.0, .25, fbmd(R + S*.5, 7., .5, 2.).x + .1);
      em = vec3(1., .66, .32)*town*coast*uCity*(1. - .8*cl)*1.6;
    }
    alb = mix(alb, vec3(.92), cl*.85);
    spec *= 1. - cl;
    Np = normalize(mix(Np, R, cl));
  }
  // back to view space, then light it
  vec3 Nv = vec3(Np.x*ca - Np.z*sa, Np.y, Np.x*sa + Np.z*ca);
  alb = pow(alb, vec3(2.2));
  float dif = max((dot(Nv, L) + wrap)/(1. + wrap), 0.);
  float day = smoothstep(-.08, .12, dot(N, L));     // the sphere's own day side, for lights and glint
  vec3 col = alb*uSunCol*dif*2.2 + alb*uAmb*1.5;
  vec3 Hh = normalize(L + vec3(0., 0., 1.));
  col += uSunCol*spec*(pow(max(dot(N, Hh), 0.), 90.)*1.6 + pow(max(dot(N, Hh), 0.), 12.)*.08)*day; // sun glint on water
  col += em*(1. - day);
  float rim = pow(1.-z, 3.);
  col += uAtm*uSunCol*rim*(.25+max(dot(N, L), 0.))*1.2;
  float aa = 1.-smoothstep(1.-uPx*1.5, 1., r);
  o = vec4(col*aa, aa);
}`;
// A star, in world space on a quad 2.4 radii wide: a granulated, limb-darkened disc, HDR-bright so it blooms, inside
// a corona that streams outward. uCol is the star's linear colour.
const STARBODY_VS = `#version 300 es
in vec2 aPos;
${WORLD_POS}
uniform vec2 uC; uniform float uR;
out vec2 vQ;
void main(){ vQ = aPos*2.4; gl_Position = clipOf(uC + aPos*uR*2.4); }`;
const STARBODY_FS = `#version 300 es
precision highp float; in vec2 vQ; out vec4 o;
uniform vec3 uCol; uniform float uTime, uPx;
${NOISE}
void main(){
  float r = length(vQ), a = atan(vQ.y, vQ.x);
  float rr = max(r, 1.);
  float cor = (exp(-(rr-1.)*3.)*.7 + exp(-(rr-1.)*11.)*1.6) * (.75 + .5*fbm(vec2(a*2.6, rr*1.4 - uTime*.08)));
  cor *= 1. - smoothstep(1.9, 2.4, r);
  vec3 col = uCol*cor;
  float aa = 1. - smoothstep(1. - uPx*1.5, 1., r);
  if (r < 1.) {
    float z = sqrt(1. - r*r);
    float gran = fbm(vQ*16./(.35 + z) + vec2(uTime*.04, -uTime*.03));
    vec3 disc = uCol*(3.2 + 1.6*gran)*(.42 + .58*pow(z, .55));

  o = vec4(col, aa);
}`;
// The plasma sheath a ship wears on descent and launch (the Book's landing sequence): a glow that hugs the hull's
// silhouette, read from the bake's distance field, so it fits every generated shape. Red-hot, white at the nose,
// which leads the descent; uFade blends it toward the atmosphere's tint as the ship sinks into it.
const SHEATH_VS = `#version 300 es
in vec2 aPos;
${WORLD_POS}
uniform vec2 uC; uniform float uHalfM, uAng, uSc;
out vec2 vQ;
void main(){ vQ = aPos; float c = cos(uAng), s = sin(uAng); gl_Position = clipOf(uC + mat2(c,s,-s,c)*(aPos*uHalfM*uSc)); }`;
const SHEATH_FS = `#version 300 es
precision highp float; in vec2 vQ; out vec4 o;
uniform sampler2D uX; uniform float uS, uDmax, uHeat, uFade, uTime; uniform vec3 uAtm;
${NOISE}
void main(){
  vec2 uv = vec2(vQ.x*.5+.5, .5-vQ.y*.5);
  // the bake's distance field only reaches a little past the hull; its blurrier mips spread that into a halo
  // several metres deep, which is what a sheath needs at flight zoom
  float inside = 1. - textureLod(uX, uv, 1.).r;
  float near = 1. - .5*(textureLod(uX, uv, 4.5).r + textureLod(uX, uv, 6.).r);
  float shell = clamp((near - .2)*2.2 - inside*.7, 0., 1.);  // strong nearness only: faint blur adds nothing
  shell *= shell;
  shell *= (1. - smoothstep(.55, .95, abs(vQ.x)))*(1. - smoothstep(.55, .95, abs(vQ.y))); // nothing at the quad's edges
  float lead = clamp(vQ.y*.6 + .45, 0., 1.);             // the nose leads the descent
  float n = fbm(vQ*5. + vec2(vQ.x*2., -uTime*5.));

  vec3 col = mix(hot, uAtm*1.6, uFade)*shell*(.55 + .9*n)*uHeat;
  o = vec4(col*3.2, 0.);
}`;
// Nebula gas and flare radiation, drawn twice: a full back layer under the ships and a thin haze over them.
const NEB_VS = `#version 300 es
in vec2 aPos; out vec2 vP; void main(){ vP=aPos; gl_Position=vec4(aPos,0.,1.); }`;
const NEB_FS = `#version 300 es
precision highp float; in vec2 vP; out vec4 o;
uniform vec2 uRes, uCam, uLdir; uniform float uScale, uTime, uFront, uFlare, uWorld;
uniform vec3 uPl[3]; uniform sampler2D uGas;
${NOISE}
void main(){
  vec2 w = uCam + vP*uRes*.5/uScale;
  vec2 uv = w/uWorld + .5;
  vec3 g = (uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.) ? vec3(0.) : texture(uGas, uv).rgb;
  float n1 = fbm(w*.0011 + 3.1), n2 = fbm(w*.0047 - 1.7);
  float det = .15 + 1.9*pow(clamp(n1*n2*2.2, 0., 1.5), 1.6);
  vec3 d = g*g*clamp(det, 0., 1.8);
  float flick = .6 + .8*vn(vec2(uTime*2.7, w.x*.0009 + w.y*.0006));
  float k = uFront > .5 ? .35 : 1.;
  vec3 emis = (vec3(.11,.012,.03)*d.r + vec3(.018,.011,.007)*d.g + vec3(.008,.05,.11)*d.b*flick)*k;
  float absorb = clamp(d.g*.9 + d.r*.06 + d.b*.04, 0., .9)*k;
  if (uFlare > 0. && uFront < .5) {
    float lit = 1.;
    for (int i = 0; i < 3; i++) {
      vec2 q = w - uPl[i].xy; float al = dot(q, uLdir);

  }
  o = vec4(emis, absorb);

// ======================= GRAPHICS KIT =======================
// The page-agnostic WebGL2 layer shared by the lab (index.html) and the game (play.html): context, shader
// compilation, the core programs (sky, single ships, shields, plumes, bloom chain, composite), the full-screen
// quad, baked-map textures, HDR render targets and the bloom + tone-map post pass.
// Needs shaders.js in scope. Returns null when WebGL2 is unavailable.
function makeGfx(canvas) {
  const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: true, alpha: false });
  if (!gl) return null;
  let HDR = !!gl.getExtension('EXT_color_buffer_float');

  function compile(vs, fs, attrs) {
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    if (attrs) for (const k in attrs) gl.bindAttribLocation(p, attrs[k], k);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
    return { p, u };
  }

  const P = {
    bg: compile(FS_VS, BG_FS), ship: compile(SHIP_VS, SHIP_FS), shield: compile(SHIP_VS, SHIELD_FS),
    plume: compile(PLUME_VS, PLUME_FS), mark: compile(MARK_VS, MARK_FS),
    bright: compile(FS_VS, BRIGHT_FS), down: compile(FS_VS, DOWN_FS), up: compile(FS_VS, UP_FS), comp: compile(FS_VS, COMP_FS)
  };
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const draw = () => gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // an RGBA8 texture with mipmaps from baked map bytes (res x res)
  function tex(data, res) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, res, res, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(data.buffer, data.byteOffset, data.byteLength));
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  function makeRT(w, h) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    if (HDR) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { t, f, w, h, ok };
  }
  function freeRT(r) { if (r) { gl.deleteTexture(r.t); gl.deleteFramebuffer(r.f); } }

  // the scene target (HDR when float targets work) and the bloom chain of six half-size levels
  const targets = { scene: null, chain: [] };
  function buildTargets() {
    freeRT(targets.scene); targets.chain.forEach(freeRT); targets.chain = [];
    targets.scene = makeRT(canvas.width, canvas.height);
    if (!targets.scene.ok && HDR) { HDR = false; freeRT(targets.scene); targets.scene = makeRT(canvas.width, canvas.height); }
    let w = canvas.width, h = canvas.height;
    for (let i = 0; i < 6; i++) { w = Math.max(1, w >> 1); h = Math.max(1, h >> 1); targets.chain.push(makeRT(w, h)); }
    return targets;
  }

  // scene target -> screen: bloom (bright pass, downsample, additive upsample), ACES tone map, vignette, gamma.
  // debug 1: paint non-finite scene pixels magenta, non-finite bloom cyan, negative scene values yellow
  function postProcess(bloom, debug) {
    const { scene, chain } = targets;
    gl.bindVertexArray(null);
    const RW = canvas.width, RH = canvas.height;
    const useBloom = bloom > 0.001;
    if (useBloom) {
      gl.useProgram(P.bright.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, chain[0].f); gl.viewport(0, 0, chain[0].w, chain[0].h);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.t);
      gl.uniform1i(P.bright.u.uSrc, 0); gl.uniform2f(P.bright.u.uTexel, 1 / RW, 1 / RH); gl.uniform1f(P.bright.u.uThresh, HDR ? 0.9 : 0.7);
      draw();
      gl.useProgram(P.down.p); gl.uniform1i(P.down.u.uSrc, 0);
      for (let i = 1; i < chain.length; i++) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, chain[i].f); gl.viewport(0, 0, chain[i].w, chain[i].h);
        gl.bindTexture(gl.TEXTURE_2D, chain[i - 1].t); gl.uniform2f(P.down.u.uTexel, 1 / chain[i - 1].w, 1 / chain[i - 1].h);
        draw();
      }
      gl.useProgram(P.up.p); gl.uniform1i(P.up.u.uSrc, 0);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      for (let i = chain.length - 1; i > 0; i--) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, chain[i - 1].f); gl.viewport(0, 0, chain[i - 1].w, chain[i - 1].h);
        gl.bindTexture(gl.TEXTURE_2D, chain[i].t); gl.uniform2f(P.up.u.uTexel, 1 / chain[i].w, 1 / chain[i].h);
        draw();
      }
      gl.disable(gl.BLEND);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, RW, RH);
    gl.useProgram(P.comp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.t);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, chain[0].t);
    gl.uniform1i(P.comp.u.uScene, 0); gl.uniform1i(P.comp.u.uBloom, 1);
    gl.uniform1f(P.comp.u.uBloomK, useBloom ? bloom * 0.55 : 0);
    gl.uniform1f(P.comp.u.uExposure, 1.15);
    gl.uniform1i(P.comp.u.uDebug, debug || 0);
    draw();
  }

  // Read the last frame's scene target back and summarise it (debugging; slow): counts of non-finite and
  // negative pixels, their bounding box in target pixels (y up), and the largest finite channel value.
  function inspectScene() {
    const { scene } = targets, w = scene.w, h = scene.h, px = new Float32Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, scene.f);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let bad = 0, neg = 0, max = 0, x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (let i = 0; i < w * h; i++) {
      let isBad = false;
      for (let c = 0; c < 3; c++) {
        const v = px[i * 4 + c];
        if (!Number.isFinite(v)) isBad = true; else { if (v < 0) neg++; if (v > max) max = v; }
      }
      if (isBad) { bad++; const x = i % w, y = (i / w) | 0; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    }
    return { w, h, hdr: HDR, bad, neg, max, box: bad ? [x0, y0, x1, y1] : null };
  }

  return { gl, get HDR() { return HDR; }, compile, P, quad, draw, tex, makeRT, freeRT, targets, buildTargets, postProcess, inspectScene };
}

// ======================= BAKER =======================
// Ship and station bakes on a pool of Web Workers (gen.js runs in each), uploaded as four textures per asset.
// Shared by the lab and the game. Assets live in `ships`, keyed 'brand|size' (or a caller's own key with a
// request for stations); each entry gets { ready, pending, tex: [albedo, normal, emissive, aux], maps, aux, spec }.
// opts: { genText, tex(data, res), catalog(), defaultSeed(), onBaked(key, entry), onError(key, message) }
function makeBaker(opts) {
  const ships = new Map(), queue = [], busy = new Set();
  const keyOf = (b, s) => b + '|' + s;
  let jobCounter = 0, workers = [];
  function makeWorker() {
    const src = opts.genText + `
;self.onmessage = function (e) {
  const m = e.data;
  try {
    const r = m.station ? self.ShipGen.generateStation(m.catalog, m.station, m.brand, m.seed) : self.ShipGen.generate(m.catalog, m.brand, m.size, m.seed);
    const spec = self.ShipGen.describe(r.ship);
    const mp = r.maps;
    self.postMessage({ ok: true, key: m.key, job: m.job, spec, maps: mp }, [mp.albedo.buffer, mp.nrm.buffer, mp.emis.buffer, mp.aux.buffer]);
  } catch (err) { self.postMessage({ ok: false, key: m.key, job: m.job, error: String((err && err.message) || err) }); }
};`;
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    w.onmessage = e => { busy.delete(w); onResult(e.data); pump(); };
    w.onerror = () => { busy.delete(w); pump(); };
    return w;
  }
  try { const n = Math.min(3, Math.max(1, (navigator.hardwareConcurrency || 2) - 1)); for (let i = 0; i < n; i++) workers.push(makeWorker()); } catch (e) { workers = []; }

  function onResult(m) {
    const s = ships.get(m.key);
    if (!s || s.job !== m.job) return; // superseded by a newer request
    if (!m.ok) { s.error = m.error; s.pending = false; if (opts.onError) opts.onError(m.key, m.error); return; }
    if (s.tex) s.tex.forEach(t => opts.gl.deleteTexture(t));
    const mp = m.maps;
    s.maps = { res: mp.res, extent: mp.extent, px: mp.px, hRange: mp.hRange, partCount: mp.partCount, engines: mp.engines, shieldS: mp.shieldS, Dmax: mp.Dmax };
    s.aux = mp.aux;
    s.tex = [opts.tex(mp.albedo, mp.res), opts.tex(mp.nrm, mp.res), opts.tex(mp.emis, mp.res), opts.tex(mp.aux, mp.res)];
    s.spec = m.spec; s.ready = true; s.pending = false; s.error = null;
    s.hits = s.hits || [];
    if (opts.onBaked) opts.onBaked(m.key, s);
  }
  function pump() {
    if (!workers.length) { // no workers (e.g. blocked): bake on the main thread, one per task
      if (!queue.length) return;
      const key = queue.shift(), s = ships.get(key); if (!s) return;
      const [b, z] = key.split('|'), q = s.req || { brand: b, size: z, seed: opts.defaultSeed() };
      setTimeout(() => {
        const catalog = opts.catalog();
        try { const r = q.station ? ShipGen.generateStation(catalog, q.station, q.brand, q.seed) : ShipGen.generate(catalog, q.brand, q.size, q.seed); onResult({ ok: true, key, job: s.job, spec: ShipGen.describe(r.ship), maps: r.maps }); }
        catch (err) { onResult({ ok: false, key, job: s.job, error: String(err.message || err) }); }
        pump();
      }, 0);
      return;
    }
    for (const w of workers) {
      if (busy.has(w) || !queue.length) continue;
      const key = queue.shift(), s = ships.get(key); if (!s) continue;
      const [b, z] = key.split('|'), q = s.req || { brand: b, size: z, seed: opts.defaultSeed() };
      busy.add(w);
      w.postMessage({ key, job: s.job, catalog: opts.catalog(), brand: q.brand, size: q.size, seed: q.seed, station: q.station });
    }
  }
  // queue a bake (front: next up); req overrides { brand, size, seed } or asks for a station
  function enqueue(key, front, req) {
    const s = ships.get(key) || {};
    if (req) s.req = req;
    s.job = ++jobCounter; s.pending = true; s.error = null;
    ships.set(key, s);
    const i = queue.indexOf(key); if (i >= 0) queue.splice(i, 1);
    front ? queue.unshift(key) : queue.push(key);
  }
  return { ships, queue, keyOf, enqueue, pump, workers };
}

// ======================= SIM CORE (Rust -> WASM) =======================
// The simulation core is the Rust crate in core/, compiled to WASM and inlined into the page as base64
// (tools/build.py). Columns live in WASM memory; the manifest says where, and this wraps each one in a
// typed-array view, so JS reads and writes them like any other array with no copying and no per-entity calls.
// Columns never move (allocated once at full capacity), so the views stay valid for the life of a world.
const CORE_READY = (async () => {
  const b64 = document.getElementById('core-wasm').textContent.trim();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const { instance } = await WebAssembly.instantiate(bytes, {});
  const X = instance.exports, mem = X.memory;
  const VIEW = { f64: Float64Array, f32: Float32Array, u32: Uint32Array, i32: Int32Array, u16: Uint16Array, i16: Int16Array, u8: Uint8Array };

  // cfg: { maxShips, maxTypes, maxBodies, envN, envW, seed }
  function world(cfg) {
    const w = X.dw_world_new(cfg.maxShips, cfg.maxTypes, cfg.maxBodies, cfg.envN, cfg.envW, (cfg.seed >>> 0) || 1);
    const json = new TextDecoder().decode(new Uint8Array(mem.buffer, X.dw_manifest_ptr(w), X.dw_manifest_len(w)));
    const M = JSON.parse(json), buffer = mem.buffer;
    const groups = {};
    for (const c of M.columns) (groups[c.group] ||= {})[c.name] = new VIEW[c.kind](buffer, c.ptr, c.len);
    const params = groups.world.params, P = {};
    M.params.forEach((name, k) => { P[name] = k; });
    return {
      manifest: M, DT: M.dt,
      ship: groups.ship, type: groups.type, body: groups.body, env: groups.env, game: groups.game,
      // tuning: core.param('damper') / core.param('damper', 0.6); names in core/src/world.rs
      param: (name, v) => { if (!(name in P)) throw new Error('unknown core param ' + name); if (v !== undefined) params[P[name]] = v; return params[P[name]]; },
      paramNames: M.params,
      clear: () => X.dw_clear(w), // zero every ship, tick back to 0
      setCount: n => X.dw_set_count(w, n),
      count: () => X.dw_count(w),
      setBodies: n => X.dw_set_bodies(w, n),
      due: realDt => X.dw_due(w, realDt), // fixed ticks owed for this much real time
      step: () => X.dw_step(w),
      interpolate: () => X.dw_interpolate(w), // writes ship.rx/ry/ra for this frame
      alpha: () => X.dw_alpha(w),
      tick: () => X.dw_tick(w),
      slotReset: (i, respawn) => X.dw_slot_reset(w, i, respawn ? 1 : 0),
      handle: i => X.dw_handle(w, i),
      resolve: h => X.dw_resolve(w, h),
      rand: () => X.dw_rand(w),
      reseed: seed => X.dw_reseed(w, seed >>> 0),
      // player: the core flies this slot from one input bitmask per tick (bits as in core/src/player.rs)
      setPlayer: slot => X.dw_set_player(w, slot),
      // game commands (codes and results in core/src/port.rs): apply between ticks; the page logs them for replays
      command: (code, a, b) => X.dw_command(w, code, a | 0, b | 0),
      placeLanded: body => X.dw_place_landed(w, body),
      portBelow: () => { const v = X.dw_port_below(w); return v < 0 ? null : { body: v % 1000, slow: v >= 1000 }; },
      mode: () => groups.game.mode[0], day: () => groups.game.day[0],
      setInput: bits => X.dw_set_input(w, bits >>> 0),
      playerSet: () => X.dw_player_set(w), // assist set speed, m/s
      // save: a copy of the whole world as bytes; load(bytes): 0 ok, else an error code (see snapshot.rs)
      save: () => groups.world.snapshot.slice(0, X.dw_save(w)),
      load: bytes => { if (bytes.length !== groups.world.snapshot.length) return 4; groups.world.snapshot.set(bytes); return X.dw_load(w); },
      hash: () => BigInt.asUintN(64, X.dw_hash(w)).toString(16).padStart(16, '0'),
      // views die if WASM memory ever grows; nothing allocates after creation, so this should never fire
      checkViews: () => { if (mem.buffer !== buffer) throw new Error('sim core memory grew; column views are stale'); },
      free: () => X.dw_world_free(w)
    };
  }
  // input bits, mirrored from core/src/player.rs
  // game commands, modes and results, mirrored from core/src/port.rs
  const CMD = { land: 1, launch: 2, wait: 3, skip: 4 };
  const MODE = { flying: 0, descending: 1, landed: 2, launching: 3 };
  const RESULT = { 0: 'ok', 1: 'not over a port', 2: 'too fast', 3: 'not now', 4: 'unknown command' };
  const IN = { thrust: 1, reverse: 2, left: 4, right: 8, strafeL: 16, strafeR: 32, burn: 64, fire: 128, retro: 256, assist: 512, torque: 1024 };
  return { world, IN, CMD, MODE, RESULT, scenario: (seed, ticks) => BigInt.asUintN(64, X.dw_scenario(seed, ticks)).toString(16).padStart(16, '0'), exports: X };
})();

// ======================= SCHEMA =======================
// Content enters through JSON Schemas (src/schema/*.schema.json): the contract an LLM writes against, and the
// validator that clamps what it writes before the game uses it (the Book: "output is clamped to schema ranges and
// enumerations before use"). clampToSchema walks a value against the subset of JSON Schema the schemas use
// (type, properties, required, items, minItems, maxItems, enum, minimum, maximum, minLength, maxLength, pattern,
// default) and returns a value that satisfies it, with a note for every change. A missing required field with no
// default is fatal: the value cannot be used.
function clampToSchema(schema, value, path, notes) {
  path = path || '$'; notes = notes || [];
  const note = (msg, fatal) => notes.push({ path, msg, fatal: !!fatal });
  const fallback = why => {
    if (schema.default !== undefined) { note(`${why}; using the default`); return JSON.parse(JSON.stringify(schema.default)); }
    note(why, true); return undefined;
  };
  if (value === undefined) return schema.default !== undefined ? JSON.parse(JSON.stringify(schema.default)) : undefined;
  if (schema.enum) return schema.enum.includes(value) ? value : fallback(`${JSON.stringify(value)} is not one of ${schema.enum.join(', ')}`);
  switch (schema.type) {
    case 'object': {
      if (typeof value !== 'object' || value === null || Array.isArray(value)) return fallback('not an object');
      const out = {};
      for (const [k, sub] of Object.entries(schema.properties || {})) {
        const v = clampToSchema(sub, value[k], `${path}.${k}`, notes);
        if (v !== undefined) out[k] = v;
        else if ((schema.required || []).includes(k)) notes.push({ path: `${path}.${k}`, msg: 'required', fatal: true });
      }
      for (const k of Object.keys(value)) if (!(schema.properties || {})[k]) note(`unknown field ${k} dropped`);
      return out;
    }
    case 'array': {
      if (!Array.isArray(value)) return fallback('not an array');
      let arr = value.map((v, i) => clampToSchema(schema.items || {}, v, `${path}[${i}]`, notes)).filter(v => v !== undefined);
      if (schema.maxItems !== undefined && arr.length > schema.maxItems) { note(`more than ${schema.maxItems} items; extra dropped`); arr = arr.slice(0, schema.maxItems); }
      if (schema.minItems !== undefined && arr.length < schema.minItems) return fallback(`fewer than ${schema.minItems} items`);
      return arr;
    }
    case 'number': case 'integer': {
      let v = typeof value === 'number' && Number.isFinite(value) ? value : NaN;
      if (Number.isNaN(v)) return fallback('not a number');
      if (schema.type === 'integer' && !Number.isInteger(v)) { v = Math.round(v); note('rounded to an integer'); }
      if (schema.minimum !== undefined && v < schema.minimum) { note(`${v} below ${schema.minimum}; clamped`); v = schema.minimum; }
      if (schema.maximum !== undefined && v > schema.maximum) { note(`${v} above ${schema.maximum}; clamped`); v = schema.maximum; }
      return v;
    }
    case 'string': {
      if (typeof value !== 'string') return fallback('not a string');
      let v = value;
      if (schema.maxLength !== undefined && v.length > schema.maxLength) { note(`longer than ${schema.maxLength}; cut`); v = v.slice(0, schema.maxLength); }
      if (schema.minLength !== undefined && v.length < schema.minLength) return fallback(`shorter than ${schema.minLength}`);
      if (schema.pattern && !new RegExp(schema.pattern).test(v)) return fallback(`does not match ${schema.pattern}`);
      return v;
    }
    case 'boolean': return typeof value === 'boolean' ? value : fallback('not a boolean');
    default: return value;
  }
}

// A star system, validated and laid out: the star at the origin, every body placed by its orbit (moons and
// stations around their parent), with what the core and the renderer need. Returns { system, bodies, notes };
// system is null if the file is unusable.
function loadSystem(raw, schema) {
  const notes = [];
  const sys = clampToSchema(schema, raw, '$', notes);
  if (!sys || notes.some(n => n.fatal)) return { system: null, bodies: [], notes };
  const STAR_LOOK = { 'red-dwarf': 'red', orange: 'orange', yellow: 'sol', white: 'white', 'blue-giant': 'blue' };
  const placed = new Map(), bodies = [];
  // the star is body 0
  bodies.push({ id: 'star', name: sys.star.name, kind: 'star', x: 0, y: 0, r: sys.star.radius, g: sys.star.gravity, starClass: sys.star.class, look: STAR_LOOK[sys.star.class] });
  placed.set('', bodies[0]);
  // place parents before children (a moon may be listed before its planet)
  let todo = sys.bodies.slice(), guard = 0;
  while (todo.length && guard++ < 50) {
    const next = [];
    for (const b of todo) {
      const parent = placed.get(b.parent || '');
      if (!parent) { if (sys.bodies.some(o => o.id === b.parent)) next.push(b); else notes.push({ path: `$.bodies[${b.id}]`, msg: `parent ${b.parent} not found; orbiting the star`, fatal: false }), next.push(Object.assign({}, b, { parent: '' })); continue; }
      const a = b.orbit.angle * Math.PI / 180;
      const body = {
        id: b.id, name: b.name, kind: b.kind, parent: parent.id,
        x: parent.x + Math.cos(a) * b.orbit.radius, y: parent.y + Math.sin(a) * b.orbit.radius, r: b.radius, g: b.gravity,
        look: b.look, station: b.station, port: b.port || null
      };
      bodies.push(body); placed.set(b.id, body);
    }
    todo = next;
  }
  if (sys.start && !bodies.some(b => b.id === sys.start && b.port)) notes.push({ path: '$.start', msg: `${sys.start} is not a port body; starting at the first port`, fatal: false });
  return { system: sys, bodies, notes };
}

if (typeof module !== 'undefined') module.exports = { clampToSchema, loadSystem };

// ======================= PLAY =======================
// The game page, on the way to M1. Rule: anything that changes game state runs in the sim core, so a session
// saves, loads and replays exactly (natively too). This page only turns keys into one input bitmask per tick,
// and draws what the core's columns say. Flight is the core's player model, with the Book's three assist levels:
// full assist holds a set speed along the nose (and cancels drift and gravity); drift off is raw Newtonian thrust
// with strafe; full off adds torque rotation, where a spin keeps going until countered.
const $ = id => document.getElementById(id);
const catalog = JSON.parse($('catalog').textContent);
const canvas = $('view'), hud = $('hud'), hx = hud.getContext('2d');
const G = makeGfx(canvas);
if (!G) { $('glerr').hidden = false; return; }
const { gl, compile, P, quad, draw, tex } = G;

// ---------- the system: validated (clamped) against its schema, then laid out (src/schema.js) ----------
const loaded = loadSystem(JSON.parse($('system').textContent), JSON.parse($('system-schema').textContent));
loaded.notes.forEach(n => console.warn(`system ${n.path}: ${n.msg}`));
if (!loaded.system) { $('glerr').textContent = 'The system file is unusable: ' + loaded.notes.filter(n => n.fatal).map(n => `${n.path} ${n.msg}`).join('; '); $('glerr').hidden = false; return; }
const SYS = loaded.system, BODIES = loaded.bodies, STAR = BODIES[0];
const star = STARS[STAR.look] || STARS.sol;
const SURFACE = { terran: 0, giant: 1, rock: 2 }, BODY_KIND = { star: 0, planet: 1, moon: 2, station: 3 };
// planets and moons, drawn by the planet shader
const WORLDS = BODIES.filter(b => b.kind === 'planet' || b.kind === 'moon').map(b => {
  const L = b.look || {}, pal = L.palette || ['#5e5953', '#8a8178', '#c9c0b4'];
  return Object.assign({}, b, { L1: hexRGB(pal[0]), L2: hexRGB(pal[1]), L3: hexRGB(pal[2]), LA: lin(hexRGB(L.atmosphere || '#9fb4c8')), seed: L.seed || 1, surface: SURFACE[L.surface] || 0, city: L.cityLights || 0 });
});
// light comes from the star: the direction toward it from (x, y), tipped toward the camera so day sides read
function sunFrom(x, y) {
  const dx = STAR.x - x, dy = STAR.y - y, l = Math.hypot(dx, dy);
  const v = l > 1 ? [dx / l, dy / l, 0.45] : [0, 0, 1], n = Math.hypot(v[0], v[1], v[2]);
  return [v[0] / n, v[1] / n, v[2] / n];
}

// ---------- ship types: one per brand x size; flight stats from the catalog, looks from the bake ----------
const baker = makeBaker({
  gl, tex, genText: $('gen').textContent, catalog: () => catalog, defaultSeed: () => 'play-1',
  onError: (key, msg) => console.error('bake failed', key, msg)
});
const nSizes = catalog.sizes.length;
const types = [];
catalog.brands.forEach((b, bi) => catalog.sizes.forEach((z, zi) => {
  const fz = z.flight || {}, fb = b.style.flight || {};

      gl.uniform1f(u.uGloss, m.gloss); gl.uniform1f(u.uSpecK, 0.6 + m.spec * 1.4); gl.uniform1f(u.uWrap, m.wrap); gl.uniform1f(u.uIrid, m.irid); gl.uniform1f(u.uRim, m.rim);
      for (let q = 0; q < 4; q++) { gl.activeTexture(gl.TEXTURE0 + q); gl.bindTexture(gl.TEXTURE_2D, s.tex[q]); }
    };
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    for (const S of STATIONS) {
      if (!stationReady(S) || Math.abs(S.x - cx) > halfW + S.half || Math.abs(S.y - cy) > halfH + S.half) continue;
      setView(FP.ship, RW, RH, cx, cy);
      const u = FP.ship.u;
      shipUniforms(u, sunFrom(S.x, S.y)); gl.uniform1i(u.uLN, 0);
      bindLook(u, S.s, S.half, S.brand);
      stInst.set([S.x, S.y, t * S.spin, 0, 0, 1]);
      gl.bindVertexArray(VS.ship.vao); upload(VS.ship, stInst, 1); pointAt(VS.ship, 0);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 1);
      gl.bindVertexArray(null);
    }

    // which ships are drawable and on screen
    typeCount.fill(0);
    const shown = i => {
      if (!SH.alive[i]) return false;
      const T = types[SH.kind[i]];
      if (!typeReady(T)) return false;
      const m = T.half * 1.2 + T.L * 2;
      return Math.abs(SH.rx[i] - cx) < halfW + m && Math.abs(SH.ry[i] - cy) < halfH + m;
    };
    let nL = 0, nPl = 0;
    for (let i = 0; i < live; i++) {
      if (!shown(i)) continue;
      const T = types[SH.kind[i]], c = Math.cos(SH.ra[i]), s = Math.sin(SH.ra[i]), th = SH.thr[i];
      typeCount[SH.kind[i]]++;
      // burner intensity follows the engine glow, which ramps toward 1 only on the burner (cruise tops out at .72),
      // so the tint, length and brightness flare in and fade out over a few frames instead of snapping
      const bi = Math.max(0, Math.min(1, (th - 0.72) / 0.28)), pw = plumePower(th) * 1.35 * (1 + 0.35 * bi);
      if (th >= 0.05 && nL < 16) { // engine light on the hull
        const ex = T.engX, ey = T.engY - T.L * 0.12, k = pw * 1.5;
        LP.set([SH.rx[i] + c * ex - s * ey, SH.ry[i] + s * ex + c * ey, T.L * 0.05 + 1.5, T.L * 1.6 + 8], nL * 4);
        LC.set([T.br.plCol[0] * k, T.br.plCol[1] * k, T.br.plCol[2] * k, 0], nL * 4); nL++;
      }
      // thruster jets: side jets fire away from the push (lateral thrust +x pushes right), reverse jets out of the nose
      const jet = (lx, ly, dx, dy, k) => {
        if (nPl >= MAXS * 12) return;
        const o = nPl * 10;
        plumeInst[o] = SH.rx[i] + c * lx - s * ly; plumeInst[o + 1] = SH.ry[i] + s * lx + c * ly;
        plumeInst[o + 2] = c * dx - s * dy; plumeInst[o + 3] = s * dx + c * dy;
        plumeInst[o + 4] = T.L * (0.08 + 0.22 * k); plumeInst[o + 5] = T.L * 0.05; plumeInst[o + 6] = i * 3.1 + lx; plumeInst[o + 7] = 0.35 + 0.9 * k;
        plumeInst[o + 8] = RCS; plumeInst[o + 9] = 0; nPl++;
      };
      const lat = SH.lat[i], rev = -Math.min(0, SH.main[i]);
      const A = T.rcs || { fl: [-T.half * 0.3, T.half * 0.28], fr: [T.half * 0.3, T.half * 0.28], rl: [-T.half * 0.3, -T.half * 0.24], rr: [T.half * 0.3, -T.half * 0.24], nl: [-T.half * 0.12, T.half * 0.42], nr: [T.half * 0.12, T.half * 0.42] };
      // turning: diagonal pairs (front-right with rear-left turns left, the other pair right). The torque is what the
      // core's steer stage applies this tick: the turn command itself in full off, else the step toward the target
      // rate. Pulses linger a few frames, and a faint trim shows while the ship is turning, so a turn reads clearly.
      const turnT = T.turn, step = turnT * turnSlew * sim.DT;
      const torque = SH.rot[i] ? SH.turn_in[i] : Math.max(-1, Math.min(1, (SH.turn_in[i] * turnT - SH.av[i]) / step));
      spinVis[i] = Math.abs(torque) >= Math.abs(spinVis[i]) * 0.86 ? torque : spinVis[i] * 0.86;
      const spin = Math.max(-1, Math.min(1, spinVis[i] + 0.25 * SH.av[i] / turnT)), ks = Math.abs(spin);
      if (ks > 0.06) {
        // turning left (counter-clockwise): front-right and rear-left fire outward; turning right, the other pair
        if (spin > 0) { jet(A.fr[0], A.fr[1], 1, 0, ks); jet(A.rl[0], A.rl[1], -1, 0, ks); }
        else { jet(A.fl[0], A.fl[1], -1, 0, ks); jet(A.rr[0], A.rr[1], 1, 0, ks); }
      }
      // strafing right (+x) fires the left flank outward, front and rear; strafing left, the right flank
      if (Math.abs(lat) > 0.05) { const k = Math.abs(lat); if (lat > 0) { jet(A.fl[0], A.fl[1], -1, 0, k); jet(A.rl[0], A.rl[1], -1, 0, k); } else { jet(A.fr[0], A.fr[1], 1, 0, k); jet(A.rr[0], A.rr[1], 1, 0, k); } }
      if (rev > 0.05) { jet(A.nl[0], A.nl[1], 0, 1, rev); jet(A.nr[0], A.nr[1], 0, 1, rev); }
      if (th < 0.03) continue;
      for (let e = 0; e < T.eng.length && nPl < MAXS * 12; e++) {
        const E = T.eng[e], o = nPl * 10;
        plumeInst[o] = SH.rx[i] + c * E.lx - s * E.ly; plumeInst[o + 1] = SH.ry[i] + s * E.lx + c * E.ly;
        plumeInst[o + 2] = c * E.dx - s * E.dy; plumeInst[o + 3] = s * E.dx + c * E.dy;
        plumeInst[o + 4] = E.w * T.br.plLen * (0.5 + 2.6 * th) * (1 + 1.2 * bi); plumeInst[o + 5] = E.w * T.br.plWid * 1.35 * (1 + 0.3 * bi);
        plumeInst[o + 6] = i * 7.3 + e * 1.37; plumeInst[o + 7] = pw; plumeInst[o + 8] = T.bi; plumeInst[o + 9] = bi;
        nPl++;
      }
    }
    if (nPl) {
      gl.blendFunc(gl.ONE, gl.ONE);
      setView(FP.plume, RW, RH, cx, cy);
      const u = FP.plume.u; gl.uniform1f(u.uTime, t);
      gl.uniform3fv(u.uPlCol, plCol); gl.uniform3fv(u.uPlCore, plCore); gl.uniform4fv(u.uPlP, plP); gl.uniform1fv(u.uPlSpread, plSpread); gl.uniform3fv(u.uPlBurn, plBurn);
      gl.bindVertexArray(VS.plume.vao); upload(VS.plume, plumeInst, nPl);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nPl);
      gl.bindVertexArray(null);
    }
    // hulls, bucketed by type
    let acc = 0;
    for (const k of order) { typeStart[k] = acc; acc += typeCount[k]; typeFill[k] = typeStart[k]; }
    for (let i = 0; i < live; i++) {
      if (!shown(i)) continue;
      const o = typeFill[SH.kind[i]]++ * 6;
      shipInst[o] = SH.rx[i]; shipInst[o + 1] = SH.ry[i]; shipInst[o + 2] = SH.ra[i]; shipInst[o + 3] = SH.thr[i]; shipInst[o + 4] = 0; shipInst[o + 5] = 0;
    }
    // the player's descent or launch: out of the flight sim, drawn from the game state, shrinking into the surface
    // inside a plasma sheath (docking at a station: a short shrink into the clamps, no plasma)
    let seq = null;
    if ((mode === MODE.descending || mode === MODE.launching) && typeReady(T0)) {
      const B = BODIES[sim.game.at[0]], total = mode === MODE.descending ? 2.5 : 2.0;
      const p = 1 - sim.game.timer[0] / total, d = mode === MODE.descending ? p : 1 - p; // d: 0 in flight .. 1 down
      const st = B.kind === 'station', ss = x => x * x * (3 - 2 * x), seg = (a, b, x) => ss(Math.max(0, Math.min(1, (x - a) / (b - a))));
      seq = { sc: st ? 1 - 0.45 * seg(0, 1, d) : 1 - 0.85 * seg(0.08, 1, d), heat: st ? 0 : seg(0, 0.2, d) * (1 - seg(0.88, 1, d)), fade: seg(0.5, 0.95, d), atm: (WORLDS.find(w => w.id === B.id) || {}).LA || [0.6, 0.7, 0.8] };
      const ti = SH.kind[0];
      typeStart[ti] = acc; typeCount[ti] = 1;
      shipInst.set([SH.x[0], SH.y[0], SH.ang[0], 0, 0, seq.sc], acc * 6); acc++;
    }
    if (acc) {
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      setView(FP.ship, RW, RH, cx, cy);
      const u = FP.ship.u;
      shipUniforms(u, sunCam);
      gl.uniform4fv(u.uLP, LP); gl.uniform4fv(u.uLC, LC); gl.uniform1i(u.uLN, nL);
      gl.bindVertexArray(VS.ship.vao); upload(VS.ship, shipInst, acc);
      for (const k of order) {
        if (!typeCount[k]) continue;
        const T = types[k], m = T.brand.style.material;
        gl.uniform1f(u.uHalfM, T.half); gl.uniform1f(u.uExtent, T.extent); gl.uniform1f(u.uHRange, T.s.maps.hRange);
        gl.uniform1f(u.uDmax, T.Dmax); gl.uniform1f(u.uS, T.S);
        gl.uniform1f(u.uGloss, m.gloss); gl.uniform1f(u.uSpecK, 0.6 + m.spec * 1.4); gl.uniform1f(u.uWrap, m.wrap); gl.uniform1f(u.uIrid, m.irid); gl.uniform1f(u.uRim, m.rim);
        for (let q = 0; q < 4; q++) { gl.activeTexture(gl.TEXTURE0 + q); gl.bindTexture(gl.TEXTURE_2D, T.s.tex[q]); }
        pointAt(VS.ship, typeStart[k]);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, typeCount[k]);
      }
      gl.bindVertexArray(null);
    }
    if (seq && seq.heat > 0.01) {
      gl.blendFunc(gl.ONE, gl.ONE);
      setView(FP.sheath, RW, RH, cx, cy);
      const u = FP.sheath.u, m = T0.s.maps;
      gl.uniform2f(u.uC, SH.x[0], SH.y[0]); gl.uniform1f(u.uHalfM, T0.half * 1.15); gl.uniform1f(u.uAng, SH.ang[0]); gl.uniform1f(u.uSc, seq.sc);
      gl.uniform1f(u.uS, m.shieldS); gl.uniform1f(u.uDmax, m.Dmax); gl.uniform1f(u.uHeat, seq.heat); gl.uniform1f(u.uFade, seq.fade);
      gl.uniform1f(u.uTime, t); gl.uniform3fv(u.uAtm, seq.atm);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T0.s.tex[3]); gl.uniform1i(u.uX, 0);
      draw();
    }
    gl.disable(gl.BLEND);
    G.postProcess(bloomOn ? 0.9 : 0, nanView);
  }

  // ---------- HUD ----------
  function drawHUD() {
    hx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hx.clearRect(0, 0, W, H);
    const mode = sim.mode();
    if (mode === MODE.landed) return; // the port screen is the HUD
    if (mode !== MODE.flying) { // in a landing or launch sequence: the day and how to skip it
      hx.font = '600 12px "IBM Plex Mono", ui-monospace, monospace'; hx.textBaseline = 'middle'; hx.textAlign = 'center';
      const B = BODIES[sim.game.at[0]];
      label(`${mode === MODE.descending ? (B.kind === 'station' ? 'DOCKING AT' : 'LANDING AT') : 'LAUNCHING FROM'} ${B.port.name.toUpperCase()}  ·  ENTER TO SKIP`, W / 2, H - stripH - 40);
      hx.textAlign = 'left'; return;
    }
    const T0 = types[SH.kind[0]], sp = Math.hypot(SH.vx[0], SH.vy[0]), hd = ((-SH.ang[0] * 180 / Math.PI) % 360 + 360) % 360;
    const burn = SH.burn[0] && SH.main[0] > 0;
    // top speed along the nose here, by the core's rule: raised pointing into a well, lowered pointing out
    const nx0 = -Math.sin(SH.ang[0]), ny0 = Math.cos(SH.ang[0]), cIn = nx0 * SH.well_x[0] + ny0 * SH.well_y[0];
    const wk = SH.well[0] * T0.well * (sim.param('well_in') * Math.max(cIn, 0) - sim.param('well_out') * Math.max(-cIn, 0));
    const topNow = Math.max(0.15, 1 + wk) * T0.vmax * (burn ? sim.param('burn_cap') : 1);
    const lines = [
      [`DAY ${sim.day()}  ·  ${T0.name}`, '#dbe0e7'],
      [`SPD ${sp.toFixed(0).padStart(4)} / ${topNow.toFixed(0)} m/s${assist() ? `  SET ${sim.playerSet().toFixed(0)}` : ''}`, wk < -0.03 ? '#e08a4a' : wk > 0.03 ? '#7fd08a' : '#dbe0e7'],
      [`HDG ${hd.toFixed(0).padStart(3, '0')}°  ${ASSIST[assistMode].hud}${burn ? '  BURN' : ''}`, burn ? '#e2b866' : assistMode ? '#c8a27a' : '#8a95a4'],
      [`TICK ${sim.tick()}  ${fps.toFixed(0)} fps`, '#8a95a4']
    ];
    hx.font = '500 11.5px "IBM Plex Mono", ui-monospace, monospace'; hx.textBaseline = 'middle';
    hx.fillStyle = 'rgba(7,9,12,.55)'; hx.fillRect(6, 6, 300, lines.length * 17 + 31); // + the nearest-body line
    lines.forEach(([t, c], k) => { hx.fillStyle = c; hx.fillText(t, 14, 20 + k * 17); });
    if (!typeReady(T0)) { hx.fillStyle = '#e2b866'; hx.fillText('Baking your ship…', 14, 20 + lines.length * 17 + 28); }
    drawShipMarks(T0);
    drawLandingPrompt();
    const navs = navObjects().map(o => Object.assign(o, navInfo(o)));
    drawNav(navs);
    drawMinimap(navs);
  }

  // Around the player's ship: the velocity vector (amber line and ring, longer with speed), the assist set-speed
  // tick along the nose, and a heading chevron when the hull is too small to read at this zoom.
  function drawShipMarks(T0) {
    const [cx, cy] = toScreen(SH.rx[0], SH.ry[0]), hullPx = T0.half * scale / dpr;
    const r0 = Math.max(18, hullPx * 0.75), sp = Math.hypot(SH.vx[0], SH.vy[0]);
    hx.lineWidth = 1.5;
    if (sp > 1) {
      const len = 30 + 60 * Math.min(1.3, sp / T0.vmax), ux = SH.vx[0] / sp, uy = -SH.vy[0] / sp;
      hx.strokeStyle = 'rgba(226,184,102,.8)';
      hx.beginPath(); hx.moveTo(cx + ux * r0, cy + uy * r0); hx.lineTo(cx + ux * (r0 + len), cy + uy * (r0 + len)); hx.stroke();
      hx.beginPath(); hx.arc(cx + ux * (r0 + len), cy + uy * (r0 + len), 4, 0, 6.283); hx.stroke();
    }
    const nx = -Math.sin(SH.ra[0]), ny = -Math.cos(SH.ra[0]); // nose direction on screen
    if (assist()) {
      const len = 30 + 60 * Math.min(1.3, sim.playerSet() / T0.vmax), qx = cx + nx * (r0 + len), qy = cy + ny * (r0 + len);
      hx.strokeStyle = 'rgba(159,180,200,.75)';
      hx.beginPath(); hx.moveTo(qx - ny * 6, qy + nx * 6); hx.lineTo(qx + ny * 6, qy - nx * 6); hx.stroke();
    }
    if (hullPx < 7) {
      const s = 7, px = -ny, py = nx; // chevron centred on the ship, pointing along the nose
      hx.fillStyle = '#dbe0e7'; hx.strokeStyle = 'rgba(7,9,12,.85)'; hx.lineWidth = 2.5;
      hx.beginPath(); hx.moveTo(cx + nx * s, cy + ny * s);
      hx.lineTo(cx - nx * s * .7 + px * s * .7, cy - ny * s * .7 + py * s * .7); hx.lineTo(cx - nx * s * .3, cy - ny * s * .3);
      hx.lineTo(cx - nx * s * .7 - px * s * .7, cy - ny * s * .7 - py * s * .7); hx.closePath(); hx.stroke(); hx.fill();
    }
  }

  // over a port: say so, and whether the ship is slow enough to land (the Book: be over it and nearly still)
  function drawLandingPrompt() {
    const pb = sim.portBelow();
    if (!pb) return;
    const B = BODIES[pb.body], st = B.kind === 'station', limit = sim.param(st ? 'dock_speed' : 'land_speed');
    hx.font = '600 13px "IBM Plex Mono", ui-monospace, monospace'; hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.fillStyle = pb.slow ? '#7fd08a' : '#e2b866';
    label(pb.slow ? `L  ${st ? 'DOCK AT' : 'LAND AT'} ${B.port.name.toUpperCase()}` : `${B.port.name.toUpperCase()}: SLOW BELOW ${limit} M/S TO ${st ? 'DOCK' : 'LAND'}`, W / 2, H - stripH - 40);
    hx.textAlign = 'left';
  }

  // ---------- navigation: what is where ----------
  // Everything the player might steer for, from the player's drawn (interpolated) position. Planets for now;
  // stations, ports and targets join this list as they arrive.
  const navObjects = () => BODIES.map(b => ({ name: b.port ? `${b.name} (${b.port.name})` : b.name, short: b.name, x: b.x, y: b.y, r: b.r, kind: b.kind, port: !!b.port }));
  function navInfo(o) {
    const dx = o.x - SH.rx[0], dy = o.y - SH.ry[0], d = Math.hypot(dx, dy) || 1;
    return { d, surf: d - o.r, closing: (SH.vx[0] * dx + SH.vy[0] * dy) / d }; // surface distance; closing speed > 0
  }
  const fmtDist = m => m < 1000 ? `${Math.max(0, m).toFixed(0)} m` : `${(m / 1000).toFixed(m < 10000 ? 2 : 1)} km`;
  const fmtClose = v => Math.abs(v) < 1 ? '' : `${v > 0 ? 'closing' : 'opening'} ${Math.abs(v).toFixed(0)} m/s`;
  const toScreen = (x, y) => [(x - camX) * scale / dpr + W / 2, H / 2 - (y - camY) * scale / dpr];
  const NAV_COL = '#9fb4c8', NAV_HOT = '#e2b866';
  // text with a dark outline, readable over bright cloud tops
  function label(text, x, y) { hx.lineWidth = 3.5; hx.lineJoin = 'round'; hx.strokeStyle = 'rgba(7,9,12,.85)'; hx.strokeText(text, x, y); hx.fillText(text, x, y); }

  // The status line names the nearest body; with the overlay on (I), every body gets a label where it is on
  // screen, or an arrow on the screen edge pointing at it, with surface distance and closing speed.
  function drawNav(navs) {
    let near = navs[0];
    for (const o of navs) if (o.surf < near.surf) near = o;
    hx.font = '600 12px "IBM Plex Mono", ui-monospace, monospace';
    hx.fillStyle = near.surf <= 0 ? NAV_HOT : NAV_COL;
    const well = SH.well[0]; // strength of the well here (1: a full-strength planet's surface)
    hx.fillText((near.surf <= 0 ? `OVER ${near.name.toUpperCase()}` : `NEAREST ${near.name.toUpperCase()} ${fmtDist(near.surf)}`) + (well > 0.01 ? `  WELL ${Math.round(well * 100)}%` : ''), 14, 20 + 4 * 17);
    if (!navOn) return;
    const m = 34, x0 = m, y0 = m, x1 = W - m, y1 = H - stripH - m, cx = W / 2, cy = (H - stripH) / 2;
    hx.textBaseline = 'middle';
    for (const o of navs) {
      const [sx, sy] = toScreen(o.x, o.y), hot = o.surf <= 0, col = hot ? NAV_HOT : NAV_COL;
      const name = o.name.toUpperCase(), sub = hot ? 'OVER' : `${fmtDist(o.surf)}  ${fmtClose(o.closing)}`.trim();
      hx.fillStyle = col; hx.strokeStyle = col; hx.lineWidth = 1.5;
      if (sx > x0 && sx < x1 && sy > y0 && sy < y1) { // centre on screen: label it there
        hx.textAlign = 'center';
        hx.beginPath(); hx.arc(sx, sy, 5, 0, 6.283); hx.stroke();
        hx.font = '600 13px "IBM Plex Mono", ui-monospace, monospace'; label(name, sx, sy - 16);
        hx.font = '500 11.5px "IBM Plex Mono", ui-monospace, monospace'; label(sub, sx, sy + 17);
        continue;
      }
      // off screen: an arrow where the line from the view centre leaves the inset box
      let dx = sx - cx, dy = sy - cy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const t = Math.min(dx > 0 ? (x1 - cx) / dx : dx < 0 ? (x0 - cx) / dx : 1e9, dy > 0 ? (y1 - cy) / dy : dy < 0 ? (y0 - cy) / dy : 1e9);
      const ax = cx + dx * t, ay = cy + dy * t, a = Math.atan2(dy, dx);
      hx.beginPath(); hx.moveTo(ax + Math.cos(a) * 11, ay + Math.sin(a) * 11);
      hx.lineTo(ax + Math.cos(a + 2.5) * 10, ay + Math.sin(a + 2.5) * 10); hx.lineTo(ax + Math.cos(a - 2.5) * 10, ay + Math.sin(a - 2.5) * 10);
      hx.closePath(); hx.lineWidth = 3; hx.strokeStyle = 'rgba(7,9,12,.85)'; hx.stroke(); hx.fill();
      hx.strokeStyle = col;
      const lx = ax - dx * 26, ly = ay - dy * 26; // label just inside the arrow
      hx.textAlign = dx > 0.5 ? 'right' : dx < -0.5 ? 'left' : 'center';
      hx.font = '600 12px "IBM Plex Mono", ui-monospace, monospace'; label(name, lx, ly - 7);
      hx.font = '500 11px "IBM Plex Mono", ui-monospace, monospace'; label(sub, lx, ly + 8);
    }
    hx.textAlign = 'left';
  }

  // Minimap: north up, centred on the player, bodies to scale; anything beyond the range sits on the rim.
  const MAP_RANGE = 24000; // meters from centre to rim
  function drawMinimap(navs) {
    const R = Math.max(60, Math.min(96, Math.min(W, H) * 0.14)), cx = W - R - 14, cy = H - stripH - R - 14, k = R / MAP_RANGE;
    const px = SH.rx[0], py = SH.ry[0];
    hx.save();
    hx.beginPath(); hx.arc(cx, cy, R, 0, 6.283); hx.fillStyle = 'rgba(7,9,12,.72)'; hx.fill(); hx.clip();
    hx.strokeStyle = 'rgba(138,149,164,.18)'; hx.lineWidth = 1;
    hx.beginPath(); hx.arc(cx, cy, R / 2, 0, 6.283); hx.stroke();
    hx.beginPath(); hx.moveTo(cx - R, cy); hx.lineTo(cx + R, cy); hx.moveTo(cx, cy - R); hx.lineTo(cx, cy + R); hx.stroke();
    hx.font = '500 10px "IBM Plex Mono", ui-monospace, monospace'; hx.textAlign = 'center'; hx.textBaseline = 'middle';
    for (const o of navs) {
      let mx = (o.x - px) * k, my = -(o.y - py) * k;
      const md = Math.hypot(mx, my), rr = Math.max(2.5, o.r * k), hot = o.surf <= 0;
      if (md - rr > R) { // beyond range: a pip on the rim
        mx *= (R - 4) / md; my *= (R - 4) / md;
        hx.fillStyle = NAV_COL; hx.beginPath(); hx.arc(cx + mx, cy + my, 2.5, 0, 6.283); hx.fill();
        continue;
      }
      hx.strokeStyle = hot ? NAV_HOT : 'rgba(159,180,200,.75)'; hx.lineWidth = hot ? 1.5 : 1;
      hx.beginPath(); hx.arc(cx + mx, cy + my, rr, 0, 6.283); hx.stroke();
      hx.fillStyle = hot ? NAV_HOT : o.port ? 'rgba(127,208,138,.9)' : 'rgba(159,180,200,.85)'; hx.fillText(o.short.slice(0, 3).toUpperCase(), cx + mx, cy + my - rr - 7);
    }
    // the player: velocity line and heading arrow (world y up, screen y down)
    const vx = SH.vx[0] * k * 6, vy = -SH.vy[0] * k * 6;
    hx.strokeStyle = 'rgba(226,184,102,.8)'; hx.beginPath(); hx.moveTo(cx, cy); hx.lineTo(cx + vx, cy + vy); hx.stroke();
    hx.translate(cx, cy); hx.rotate(-SH.ra[0]);
    hx.fillStyle = '#dbe0e7'; hx.beginPath(); hx.moveTo(0, -6); hx.lineTo(4, 5); hx.lineTo(-4, 5); hx.closePath(); hx.fill();
    hx.restore();
    hx.strokeStyle = 'rgba(138,149,164,.45)'; hx.lineWidth = 1; hx.beginPath(); hx.arc(cx, cy, R, 0, 6.283); hx.stroke();
    hx.fillStyle = '#8a95a4'; hx.font = '500 10px "IBM Plex Mono", ui-monospace, monospace'; hx.textAlign = 'right';
    hx.fillText(`${MAP_RANGE / 1000} km`, cx + R, cy - R - 8);
    hx.textAlign = 'left';
  }

  // test hook: drive and inspect the session from a console or a headless browser
  window.__play = {
    sim, IN, CMD, MODE, newGame, exportReplay, command, BODIES,
    setNav,
    probe: () => ({ tick: sim.tick(), hash: sim.hash(), x: SH.x[0], y: SH.y[0], v: Math.hypot(SH.vx[0], SH.vy[0]), set: sim.playerSet(), assist: assistMode, mode: sim.mode(), day: sim.day(), at: sim.game.at[0], ready: typeReady(types[SH.kind[0]]) }),
    // hold keys for sec seconds of sim time (recorded like live input)
    advance: (sec, held) => {
      const saved = new Set(keys); keys.clear(); (held || []).forEach(k => keys.add(k));
      const bits = inputBits(IN);
      if (bits !== lastBits) { sim.setInput(bits); rec.log.push([sim.tick(), bits]); lastBits = bits; }
      for (let k = 0; k < Math.round(sec / sim.DT); k++) sim.step();
      keys.clear(); saved.forEach(k => keys.add(k));
    },
    save: () => saveGame(), load: () => loadGame(), b64, unb64,
    inspect: () => G.inspectScene(), setZoom
  };
  newGame(1);
  canvas.focus();
  requestAnimationFrame(frame);
}).catch(e => { console.error(e); $('glerr').textContent = 'The sim core failed to start: ' + (e.message || e); $('glerr').hidden = false; });

})();
</script>
